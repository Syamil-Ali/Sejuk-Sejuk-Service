name: verify
on:
  push:
  pull_request:
jobs:
  assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/agno
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agno/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: python -m sejuk_assistant.query.profile_generator --migrations ../supabase/migrations
      - run: pytest
  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
        working-directory: backend/supabase
      - run: supabase db reset --local
        working-directory: backend/supabase
      - run: supabase test db
        working-directory: backend/supabase
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: app
    if: ${{ vars.E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium && npm run test:e2e -- --project=chromium
