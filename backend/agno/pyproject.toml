[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sejuk-assistant"
version = "0.1.0"
description = "Role-scoped Agno assistant service for Sejuk Ops"
requires-python = ">=3.10,<3.14"
dependencies = [
  "agno==2.5.10",
  "fastapi==0.116.1",
  "google-genai==1.75.0",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyJWT[crypto]==2.10.1",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "sqlglot==30.17.0",
  "supabase==2.18.1",
  "tzdata==2026.3",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9"
]

[project.scripts]
sejuk-assistant = "sejuk_assistant.main:run"
sejuk-profile-check = "sejuk_assistant.query.profile_generator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sejuk_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["sejuk_assistant"]
